tables:
  Test_006_Count:
    validations:
      data_validation:
        source_table_name: Test_006_Count
        source: redshift
        source_database: '{env}_source'
        source_schema: consume
        pksourcecolumn: row_hash
        summary: Validate consistency in data volume for Delinquent Units between
          the legacy (Iceberg) and new (Gold).
        report_tile: 'Delinquency % of Occupied - Trend

          Delinquent Units by Aging Bucket'
        sourcequery: 'SELECT

          COALESCE(NULLIF(TRIM(CAST(facility_id AS VARCHAR)), ''''), ''_NULL_VALUE_'')
          AS facility_id,

          COALESCE(DATE_FORMAT(CAST(report_date AS DATE), ''%Y-%m-%d''), ''_NULL_VALUE_'')
          AS report_date,

          CAST(COUNT(CASE WHEN days_past_due BETWEEN 0 AND 10 THEN 1 END) AS VARCHAR)
          AS count_0_to_10_days,

          CAST(COUNT(CASE WHEN days_past_due BETWEEN 11 AND 30 THEN 1 END) AS VARCHAR)
          AS count_11_to_30_days,

          CAST(COUNT(CASE WHEN days_past_due BETWEEN 31 AND 60 THEN 1 END) AS VARCHAR)
          AS count_31_to_60_days,

          CAST(COUNT(CASE WHEN days_past_due BETWEEN 61 AND 90 THEN 1 END) AS VARCHAR)
          AS count_61_to_90_days,

          CAST(COUNT(CASE WHEN days_past_due BETWEEN 91 AND 120 THEN 1 END) AS VARCHAR)
          AS count_91_to_120_days,

          CAST(COUNT(CASE WHEN days_past_due > 120 THEN 1 END) AS VARCHAR) AS count_over_120_days,

          CAST(COUNT(*) AS VARCHAR) AS total_rows

          FROM stodl_reporting_prod.sefms_delinquent_balances_last_event_last_payment_iceberg

          WHERE report_date >= DATE_ADD(''month'', -12, DATE_TRUNC(''month'', CURRENT_DATE))

          AND report_date < DATE_TRUNC(''month'', CURRENT_DATE)

          GROUP BY facility_id, report_date

          ORDER BY 2, 1;'
        target_table_name: Test_006_Count
        target: snowflake
        target_database: '{env}_gold'
        target_schema: consume
        pktargetcolumn: row_hash
        targetquery: 'WITH normalized AS (

          SELECT

          df.facility_id,

          fd.report_date,

          TRIM(fd.delinquency_aging_bucket) AS bucket

          FROM DEV_GOLD.CORE.FACT_DELINQUENCY_SNAPSHOT fd

          LEFT JOIN dev_gold.dim.dim_facility df

          ON fd.facility_key = df.facility_key

          AND df.IS_CURRENT = TRUE

          WHERE fd.REPORT_DATE >= DATEADD(month, -12, DATE_TRUNC(''month'', CURRENT_DATE))

          AND fd.REPORT_DATE < DATE_TRUNC(''month'', CURRENT_DATE)

          AND fd.platform_source = ''EDGE''

          )

          SELECT

          COALESCE(NULLIF(TRIM(CAST(facility_id AS VARCHAR)), ''''), ''_NULL_VALUE_'')
          AS facility_id,

          COALESCE(TO_CHAR(CAST(report_date AS DATE), ''YYYY-MM-DD''), ''_NULL_VALUE_'')
          AS report_date,

          CAST(COUNT(CASE WHEN bucket = ''0-10'' THEN 1 END) AS VARCHAR) AS count_0_to_10_days,

          CAST(COUNT(CASE WHEN bucket = ''11-30'' THEN 1 END) AS VARCHAR) AS count_11_to_30_days,

          CAST(COUNT(CASE WHEN bucket = ''31-60'' THEN 1 END) AS VARCHAR) AS count_31_to_60_days,

          CAST(COUNT(CASE WHEN bucket = ''61-90'' THEN 1 END) AS VARCHAR) AS count_61_to_90_days,

          CAST(COUNT(CASE WHEN bucket = ''91-120'' THEN 1 END) AS VARCHAR) AS count_91_to_120_days,

          CAST(COUNT(CASE WHEN bucket IN (''121-180'', ''181-360'', ''>360'')

          THEN 1 END) AS VARCHAR) AS count_over_120_days,

          CAST(COUNT(*) AS VARCHAR) AS total_rows

          FROM normalized

          GROUP BY 1, 2

          ORDER BY 2, 1'
